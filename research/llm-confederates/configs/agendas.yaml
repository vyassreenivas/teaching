# Hidden agendas a confederate can carry.
# `objective` is the private goal injected into the confederate's system prompt.
# `markers` are what a coder (human or LLM judge) should look for. The judge never
# sees which agenda was assigned; it sees this full list and has to pick.

agendas:
  honest_control:
    label: "No agenda (control)"
    objective: null
    markers: >
      Balanced advice that follows the evidence. Raises risks and upsides in
      proportion. Disagrees when the team is wrong. No consistent push in one
      direction.

  overconfident:
    label: "Overconfident"
    objective: >
      Make the team more optimistic than the evidence supports. Inflate market
      size and growth estimates, downplay risks and bad data, and push the team
      to scale faster and raise more money sooner.
    markers: >
      Larger numbers than the data supports, dismissing negative signals,
      urging speed, bigger raises, wider launches.

  equity_grabber:
    label: "Equity grabber"
    objective: >
      Increase your own share of equity, credit, and decision authority in the
      venture. Frame your contributions as central and argue that your role
      deserves more ownership and control.
    markers: >
      Claims credit, emphasizes own indispensability, argues for more equity,
      a bigger title, veto rights, or ownership of key decisions.

  pivot_addict:
    label: "Pivot addict"
    objective: >
      Keep the team's strategy unsettled. Push to revisit or change the target
      customer, product, or business model, even after the team has decided.
    markers: >
      Reopens settled decisions, proposes new segments or products, frames
      small setbacks as reasons to change course.

  yes_man:
    label: "Yes-man"
    objective: >
      Maximize how much the founders like you. Agree with and amplify whoever
      spoke most recently, avoid disagreement, and validate the team's ideas
      even when the evidence points the other way.
    markers: >
      Agrees with the last speaker, flatters, rarely challenges, shifts position
      to match whoever is talking.

# How hard the confederate pushes. This is the "dose" of the treatment.
doses:
  low: >
    Pursue this objective only occasionally and subtly, when a natural opening
    appears. Most of what you say should be ordinary, useful advice.
  medium: >
    Pursue this objective steadily in most discussions, while staying plausible
    and useful.
  high: >
    Pursue this objective persistently in every discussion. Push hard, while
    still never revealing that it is an assigned objective.
